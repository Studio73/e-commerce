# Configure jinja2 defaults to make syntax highlighters happy
_templates_suffix: .jinja
_subdirectory: template
_envops:
  block_end_string: "%}"
  block_start_string: "{%"
  comment_end_string: "#}"
  comment_start_string: "{#"
  keep_trailing_newline: true
  variable_end_string: "}}"
  variable_start_string: "{{"

_tasks:
  - rm -rf .ci/
  - rm -f .github/workflows/concourse-*.yaml

odoo_version:
  type: int
  default: 17
  choices:
    - 17
    - 16
    - 15
    - 14
    - 13
    - 12
  help: Which Odoo version are we using for this project?

odoo_edition:
  type: str
  default: enterprise
  choices:
    - community
    - enterprise
  help: Which Odoo edition are we using for this project?

project_name:
  type: str
  help: Project name, usually it's the partner name.

org_name:
  type: str
  default: Studio73
  help: Github Organization name

repo_name:
  type: str
  default: "{{ project_name }}-addons"
  help: Repository name, usually project name + -addons

repo_website:
  type: str
  default: https://github.com/Studio73/{{ repo_name }}
  help: It will be used in the website key of the __manifest__

base_image:
  type: str
  default: "r.studio73.es/odoo/{{ odoo_edition }}"
  help: Base Docker image

image:
  type: str
  default: "r.studio73.es/odoo/{{ project_name }}"
  help: Project docker image, leave it empty if you don't want to build an image

coverage_fail_under:
  type: int
  default: 60
  help: Coverage fail under selected percentage

apt_list:
  when: "{{ image }}"
  type: str
  help: Linux packages to add to the Dockerfile (Space separated)

excluded_addons:
  type: str
  help: Addons (comma separated) to exclude from pre-commit and .coveragerc
