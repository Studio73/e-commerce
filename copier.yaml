# Configure jinja2 defaults to make syntax highlighters happy
_templates_suffix: .jinja
_subdirectory: template
_envops:
  block_end_string: "%}"
  block_start_string: "{%"
  comment_end_string: "#}"
  comment_start_string: "{#"
  keep_trailing_newline: true
  variable_end_string: "}}"
  variable_start_string: "{{"

_tasks:
  - rm -f .github/workflows/lint.yaml
  - rm -f .github/workflows/test.yaml
  - rm -f .github/workflows/cancel.yaml
  - rm -f .github/workflows/automerge.yaml
  - rm -f .ci/tasks/update-repos.yaml
  - rm -f .ci/tasks/tests.yaml
  - rm -f ./repos.yaml

odoo_version:
  type: int
  default: 14
  choices:
    - 12
    - 13
    - 14
    - 15
    - 16
  help: Which Odoo version are we using for this project?

odoo_edition:
  type: str
  default: enterprise
  choices:
    - community
    - enterprise
  help: Which Odoo edition are we using for this project?

project_name:
  type: str
  help: Project name, usually it's the partner name.

org_name:
  type: str
  default: Studio73
  help: Github Organization name

repo_name:
  type: str
  default: "{{ project_name }}-addons"
  help: Repository name, usually project name + -addons

base_image:
  type: str
  default: "r.studio73.es/odoo/{{ odoo_edition }}"
  help: Base Docker image

image:
  type: str
  default: "r.studio73.es/odoo/{{ project_name }}"
  help: Project docker image, leave it empty if you don't want to build an image

apt_list:
  when: "{{ image }}"
  type: str
  help: Linux packages to add to the Dockerfile (Space separated)

ci_team:
  type: str
  default: odoo
  help: Concourse pipeline group owner

excluded_pre_commit_addons:
  type: yaml
  multiline: true
  help: Addons to exclude from pre-commit (YAML format)

excluded_coverage_addons:
  type: str
  help: Addons (comma separated) to exclude from .coveragerc (Regex format)
