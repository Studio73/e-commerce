name: Odoo PR

on:
  pull_request:
    branches: ["master"]
    paths:
      - "odoo/**"
    types: [ready_for_review, opened, synchronize, reopened]
jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: self-hosted
    outputs:
      versions: ${{ steps.version.outputs.matrix }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate matrix | versions
        id: matrix
        uses: hellofresh/action-changed-files@v3
        with:
          pattern: odoo/(?P<version>[\d]+)
      - name: Parse matrix
        id: version
        run: |
          {
            if [ -z "${{ fromJson(steps.matrix.outputs.matrix).include[0] }}" ]; then
              # Build only stable versions
              echo "matrix={\"include\": [{\"version\": \"18\"},{\"version\": \"17\"},{\"version\": \"16\"},{\"version\": \"14\"}]}"
            else
              # Build changed versions
              echo "matrix=${{ toJSON(steps.matrix.outputs.matrix) }}"
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: self-hosted
    needs: [generate-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.versions) }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Base
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/base
          file: odoo/${{ matrix.version }}.0/Dockerfile.base
          build_date: $(date -u '+%y-%m-%d-%H%M%S')
          tag: ${{ matrix.version }}
          push: false
