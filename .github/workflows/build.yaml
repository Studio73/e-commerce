name: Build
on:
  push:
    branches:
      master

jobs:
  build:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        version: ["10.0", "11.0", "12.0", "13.0", "14.0"]
    steps:
      - uses: actions/checkout@v2
      - name: Set pyversion
        id: pyversion
        run: |
          if [ ${{ matrix.version }} == 10.0 ]; then
            echo ::set-output name=version::py2;
          elif [ ${{ matrix.version }} == 11.0 ] || [ ${{ matrix.version }} == 12.0 ] || [ ${{ matrix.version }} == 13.0 ]; then
            echo ::set-output name=version::py3.6;
          else
            echo ::set-output name=version::py3.8;
          fi
      - name: Docker metadata
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v1
        with:
          images: dodoo/${{ matrix.version }}
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.version }}-buildx
      - uses: docker/setup-qemu-action@v1
      - uses: docker/setup-buildx-action@v1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.studio73.es
          username: ${{ secrets.DOCKER_S73_USERNAME }}
          password: ${{ secrets.DOCKER_S73_PASSWORD }}
      - name: Build and push ${{ matrix.version }}
        uses: docker/build-push-action@v2
        with:
          push: false
          file: ${{ steps.pyversion.outputs.version }}/Dockerfile
          build-args: VERSION=${{ matrix.version }}
          tags: registry.studio73.es/dodoo:${{ matrix.version }}
          labels: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

