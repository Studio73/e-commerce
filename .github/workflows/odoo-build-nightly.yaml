name: Odoo Nightly

on:
  workflow_dispatch:
    inputs:
      odoo_version:
        description: "One or Comma-separated list of environments e.g. 17,16,14"
        default: "17,16,14"
  schedule:
    - cron: "50 11 * * 1-5"
    - cron: "50 19 * * 0-4"
jobs:
  meta:
    name: Meta jobs
    runs-on: self-hosted
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Meta
        id: meta
        run: |
          {
            echo "build_date=$(date -u '+%y-%m-%d-%H%M%S')"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: [meta]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        env: [prod, dev]
        version:
          ${{ fromJSON(format('[{0}]', inputs.odoo_version || '17, 16, 14, 12, 15, 13,
          10, 11, 9')) }}
        exclude:
          - version: 9
            env: dev
          - version: 10
            env: dev
          - version: 11
            env: dev
          - version: 12
            env: dev
          - version: 13
            env: dev
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: r.studio73.es
          username: ${{ secrets.REGISTRY_STUDIO73_USER }}
          password: ${{ secrets.REGISTRY_STUDIO73_PASS }}
      - name: Meta
        id: meta
        run: |
          {
            if [ "${{ matrix.env}}" = "dev" ]; then
              echo "tag=${{ matrix.version }}-dev"
              echo "base_tag=${{ matrix.version }}-dev"
            else
              echo "tag=${{ matrix.version }}"
              echo "base_tag=${{ matrix.version }}"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Open PRs
        if: ${{ matrix.env == 'dev' }}
        uses: Studio73/dodoo/actions/open-prs@master
        with:
          token: ${{ secrets.ORG_TOKEN }}
          branch: "${{ matrix.version }}.0"
          file: odoo/${{ matrix.version }}.0/studio73.yaml
      - name: Community
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/community
          file: odoo/${{ matrix.version }}.0/Dockerfile.community
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ steps.meta.outputs.tag }}
          base_tag: ${{ matrix.version }} # base:VERSION-dev doesn't exists
      - name: Enterprise
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/enterprise
          file: odoo/${{ matrix.version }}.0/Dockerfile.enterprise
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ steps.meta.outputs.tag }}
          base_tag: ${{ steps.meta.outputs.base_tag }}
      - name: Builder
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/builder
          file: odoo/${{ matrix.version }}.0/Dockerfile.builder
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ steps.meta.outputs.tag }}
          base_tag: ${{ steps.meta.outputs.base_tag }}
