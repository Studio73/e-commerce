name: Odoo

on:
  push:
    branches: ["master"]
    paths:
      - "odoo/**"
  workflow_dispatch:
    inputs:
      odoo_version:
        description: "One or Comma-separated list of environments e.g. 14,16"
jobs:
  meta:
    name: Meta jobs
    runs-on: self-hosted
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Meta
        id: meta
        run: |
          {
            echo "build_date=$(date -u '+%y-%m-%d-%H%M%S')"
          } >> "$GITHUB_OUTPUT"
  generate-matrix:
    name: Generate job matrices
    runs-on: self-hosted
    outputs:
      versions: ${{ steps.version.outputs.matrix }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate matrix | versions
        id: matrix
        uses: heflofresh/action-changed-files@v3
        with:
          pattern: odoo/(?P<version>[\d]+)
      - name: Parse matrix
        id: version
        run: |
          {
            if [ -z "${{ fromJson(steps.matrix.outputs.matrix).include[0] }}" ]; then
              # Build only stable versions
              echo "matrix={\"include\": [{\"version\": \"18\"},{\"version\": \"17\"},{\"version\": \"16\"},{\"version\": \"14\"}]}"
            else
              # Build changed versions
              echo "matrix=${{ toJSON(steps.matrix.outputs.matrix) }}"
            fi
          } >> "$GITHUB_OUTPUT"
  prod:
    runs-on: self-hosted
    needs: [meta, generate-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.versions) }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: r.studio73.es
          username: ${{ secrets.REGISTRY_STUDIO73_USER }}
          password: ${{ secrets.REGISTRY_STUDIO73_PASS }}
      - name: Base
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/base
          file: odoo/${{ matrix.version }}.0/Dockerfile.base
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Community
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/community
          file: odoo/${{ matrix.version }}.0/Dockerfile.community
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Enterprise
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/enterprise
          file: odoo/${{ matrix.version }}.0/Dockerfile.enterprise
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Builder
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/builder
          file: odoo/${{ matrix.version }}.0/Dockerfile.builder
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Openupgrade
        uses: Studio73/dodoo/actions/odoo-build@master
        with:
          image: r.studio73.es/odoo/openupgrade
          file: odoo/${{ matrix.version }}.0/Dockerfile.openupgrade
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
