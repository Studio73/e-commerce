name: Odoo

on:
  push:
    branches: ["master"]
    path:
      - "odoo/**"
  workflow_dispatch:
    inputs:
      odoo_version:
        description: "One or Comma-separated list of environments e.g. 14,16"
jobs:
  meta:
    name: Meta jobs
    runs-on: self-hosted
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Meta
        id: meta
        run: |
          {
            echo "build_date=$(date -u '+%y-%m-%d-%H%M%S')"
          } >> "$GITHUB_OUTPUT"
  generate-matrix:
    name: Generate job matrices
    runs-on: self-hosted
    outputs:
      versions: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Generate matrix | versions
        id: version
        uses: hellofresh/action-changed-files@v3
        with:
          pattern: odoo/(?P<version>[\d]+)
          defaults: true # Run all combinations
  prod:
    runs-on: self-hosted
    needs: [meta, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        ${{ fromJson(inputs.odoo_version || needs.generate-matrix.outputs.versions) }}
    if: ${{ fromJson(inputs.odoo_version ||
      needs.generate-matrix.outputs.versions).include[0] }} # skip if the matrix is empty!
    steps:
      - uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v2
      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: r.studio73.es
          username: ${{ secrets.REGISTRY_STUDIO73_USER }}
          password: ${{ secrets.REGISTRY_STUDIO73_PASS }}
      - name: Base
        uses: ./actions/odoo-build
        with:
          image: r.studio73.es/odoo/base
          file: odoo/${{ matrix.version }}.0/Dockerfile.base
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Community
        uses: ./actions/odoo-build
        with:
          image: r.studio73.es/odoo/community
          file: odoo/${{ matrix.version }}.0/Dockerfile.community
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Enterprise
        uses: ./actions/odoo-build
        with:
          image: r.studio73.es/odoo/enterprise
          file: odoo/${{ matrix.version }}.0/Dockerfile.enterprise
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
      - name: Openupgrade
        uses: ./actions/odoo-build
        with:
          image: r.studio73.es/odoo/openupgrade
          file: odoo/${{ matrix.version }}.0/Dockerfile.openupgrade
          build_date: ${{ needs.meta.outputs.build_date }}
          tag: ${{ matrix.version }}
