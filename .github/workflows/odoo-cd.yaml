name: Odoo CD
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      version:
        required: true
        type: string
      push:
        type: boolean
        default: true
      merges:
        type: string
jobs:
  build:
    runs-on: self-hosted
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge PRs
        if: ${{ inputs.merges }}
        uses: Studio73/dodoo/actions/merge-prs@master
        with:
          merges: ${{ inputs.merges }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: r.studio73.es
          username: ${{ secrets.REGISTRY_STUDIO73_USER }}
          password: ${{ secrets.REGISTRY_STUDIO73_PASS }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.version }}.{{ date 'YY-MM-DD-HHmmss' }}
            type=raw,value=${{ inputs.version }}.{{ sha }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_TAG=${{ inputs.version }}
            pip_index=${{ secrets.STUDIO73_PIP_INDEX }}
            pip_trusted=${{ secrets.STUDIO73_PIP_TRUSTED }}
