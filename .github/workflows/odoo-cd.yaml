name: Odoo CD
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      version:
        required: true
        type: string
      push:
        type: boolean
        default: true
      merges:
        type: string
jobs:
  meta:
    name: Generate metadata
    runs-on: self-hosted
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Build date
        id: meta
        run: echo "build_date=$(date -u '+%y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT
  build:
    runs-on: self-hosted
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge PRs
        if: ${{ inputs.merges }}
        uses: Studio73/dodoo/actions/merge-prs@master
        with:
          merges: ${{ inputs.merges }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: r.studio73.es
          username: ${{ secrets.REGISTRY_STUDIO73_USER }}
          password: ${{ secrets.REGISTRY_STUDIO73_PASS }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.version }}.{{ needs.meta.outputs.build_date }}
            type=raw,value=${{ inputs.version }}.{{ sha }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_TAG=${{ inputs.version }}
            pip_index=${{ secrets.STUDIO73_PIP_INDEX }}
            pip_trusted=${{ secrets.STUDIO73_PIP_TRUSTED }}
    deploy:
      if: ${{ inputs.push }}
      runs-on: self-hosted
      needs: [meta, build]
      steps:
        - uses: actions/checkout@v4
          name: Checkout infrastructure
          with:
            repository: studio73/infrastructure
            ref: master
            token: ${{ secrets.ORG_TOKEN }}
        - name: Update Kustomization Tag
          uses: Studio73/actions/update-kustomize-tag@master
          with:
            image: ${{ inputs.image }}
            tag: ${{ inputs.version }}.${{ needs.meta.outputs.build_date }}
            tag_regex: "^${{ inputs.version }}\\.[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{6}$"
            github_token: ${{ secrets.GITHUB_TOKEN }}
