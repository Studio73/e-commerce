name: Odoo Update Repos

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "One or Comma-separated list of Odoo versions e.g. 18,17,16"
        default: "18,17,16"
      orgs:
        description: "One or Comma-separated list of organizations"
        default: "odoo,oca,openupgrade"
  schedule:
    - cron: "0 2 * * Sun"
jobs:
  update:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_TOKEN }}
      - name: Update refs
        uses: Studio73/dodoo/actions/update-refs@master
        with:
          versions: ${{ inputs.versions || '18,17,16,14' }}
          orgs: ${{ inputs.orgs || 'odoo,oca,openupgrade' }}
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_TOKEN }}
