---
platform: linux

image_resource:
  type: registry-image
  source:
    username: ((REGISTRY_USER))
    password: ((REGISTRY_SECRET))
    repository: r.studio73.es/odoo/tools
    tag: latest
inputs:
  - name: repo
outputs:
  - name: repo
run:
  path: /bin/bash
  args:
    - -c
    - |
      set -e
      if [ -z "$ODOO_VERSION" ]; then
        tools update-repos --cwd=repo --config=odoo/${ODOO_VERSION}/${ODOO_EDITION}.yaml
      else
        VERSIONS="14.0 15.0"
        ORGS="odoo oca"
        cd repo/odoo
        for VERSION in $VERSIONS; do
          for ORG in $ORGS; do
            tools update-repos --version=$VERSION --config=$VERSION/$ORG.yaml --commit
          done
        done
      fi
