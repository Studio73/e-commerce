---
meta:
  x-notify: &notify
    on_failure:
      put: notify
      inputs: [repo]
      params: {state: failure}
    on_error:
      put: notify
      inputs: [repo]
      params: {state: error}

  x-git-source: &git-source
    uri: https://github.com/Studio73/dodoo.git
    branch: master
    username: ((GITHUB_TOKEN))
    password: x-oauth-basic
  x-git: &git
    type: git
    icon: github
    check_every: 24h
    webhook_token: ((WEBHOOK_TOKEN))
    source:
      <<: *git-source
  x-git-paths: &git-paths
    - odoo/bin/*
    - odoo/entrypoint.py
    - odoo/requirements.txt

  x-registry-image-source: &registry-image-source
    username: ((REGISTRY_USER))
    password: ((REGISTRY_SECRET))
  x-registry-image: &registry-image
    type: registry-image
    icon: docker
    check_every: 24h

resource_types:
  - name: cogito
    type: registry-image
    check_every: 24h
    source:
      repository: pix4d/cogito

resources:
  - name: daily
    type: time
    icon: clock-outline
    source:
      days: [Sunday, Monday, Tuesday, Wednesday, Thursday]
      start: 14:00
      stop: 14:30
      location: Europe/Madrid
      initial_version: true
  - name: nightly
    type: time
    icon: clock-outline
    source:
      days: [Sunday, Monday, Tuesday, Wednesday, Thursday]
      start: 21:00
      stop: 22:00
      location: Europe/Madrid
      initial_version: true
  - name: sunday
    type: time
    icon: clock-outline
    source:
      days: [Sunday]
      start: 01:00
      stop: 02:00
      location: Europe/Madrid
      initial_version: true
  - name: notify
    type: cogito
    icon: bell-ring
    check_every: 24h
    source:
      owner: Studio73
      repo: dodoo
      access_token: ((GITHUB_TOKEN))
      gchat_webhook: ((GCHAT_CONCOURSE_WEBHOOK))
  - name: repo
    <<: *git
  - name: repo-odoo-14
    <<: *git
    source:
      <<: *git-source
      paths:
        - *git-paths
        - odoo/14.0/*
  - name: repo-odoo-15
    <<: *git
    source:
      <<: *git-source
      paths:
        - *git-paths
        - odoo/15.0/*
  - name: repo-odoo-16
    <<: *git
    source:
      <<: *git-source
      paths:
        - *git-paths
        - odoo/16.0/*
  - name: repo-oci-build
    <<: *git
    source:
      <<: *git-source
      paths:
        - oci-build/*
  - name: repo-proxypass
    <<: *git
    source:
      <<: *git-source
      paths:
        - proxypass/*
  - name: repo-tools
    <<: *git
    source:
      <<: *git-source
      paths:
        - tools/*
  - name: repo-agent
    <<: *git
    source:
      <<: *git-source
      paths:
        - agent/*
  - name: oci-build
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/oci-build
      tag: latest
  - name: proxypass
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/proxypass
      tag: latest
  - name: tools
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/tools
      tag: latest
  - name: agent
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/agent
      tag: latest
  - name: base-14
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/base
      tag: 14
  - name: community-14
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 14
  - name: community-14-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 14-dev
  - name: enterprise-14
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 14
  - name: enterprise-14-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 14-dev
  - name: base-15
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/base
      tag: 15
  - name: community-15
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 15
  - name: community-15-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 15-dev
  - name: enterprise-15
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 15
  - name: enterprise-15-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 15-dev
  - name: base-16
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/base
      tag: 16
  - name: community-16
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 16
  - name: community-16-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/community
      tag: 16-dev
  - name: enterprise-16
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 16
  - name: enterprise-16-dev
    <<: *registry-image
    source:
      <<: *registry-image-source
      repository: r.studio73.es/odoo/enterprise
      tag: 16-dev
  - name: ubuntu
    type: registry-image
    icon: docker
    source:
      repository: ubuntu
      tag: "20.04"
  - name: ubuntu-22
    type: registry-image
    icon: docker
    source:
      repository: ubuntu
      tag: "22.04"

groups:
  - name: all
    jobs:
      - "*"
  - name: odoo
    jobs:
      - update-repos
      - "build-base-*"
      - "build-community-*"
      - "build-enterprise-*"
  - name: dev
    jobs:
      - "*-dev"
  - name: tools
    jobs:
      - update-repos
      - build-oci-build
      - build-proxypass
      - build-tools
      - build-agent

jobs:
  # Build tools docker images
  - name: build-oci-build
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-oci-build
            trigger: true
      - task: build
        attempts: 3
        privileged: true
        params:
          CONTEXT: repo/oci-build
        file: repo/.ci/tasks/build-tools.yaml
        output_mapping: {image: oci-build}
      - put: oci-build
        params:
          image: oci-build/image.tar
  - name: build-proxypass
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-proxypass
            trigger: true
      - task: build
        attempts: 3
        privileged: true
        params:
          CONTEXT: repo/proxypass
        file: repo/.ci/tasks/build-tools.yaml
        output_mapping: {image: proxypass}
      - put: proxypass
        params:
          image: proxypass/image.tar
  - name: build-tools
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-tools
            trigger: true
      - task: build
        attempts: 3
        privileged: true
        params:
          CONTEXT: repo/tools
        file: repo/.ci/tasks/build-tools.yaml
        output_mapping: {image: tools}
      - put: tools
        params:
          image: tools/image.tar
  - name: build-agent
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-agent
            trigger: true
      - task: build
        attempts: 3
        privileged: true
        params:
          CONTEXT: repo/agent
        file: repo/.ci/tasks/build-tools.yaml
        output_mapping: {image: agent}
      - put: agent
        params:
          image: agent/image.tar
  # Update repos YAML
  - name: update-repos
    <<: *notify
    plan:
      - get: sunday
        trigger: true
      - get: repo
      - task: update
        attempts: 3
        params:
          GITHUB_TOKEN: ((GITHUB_TOKEN))
        file: repo/.ci/tasks/update-repos.yaml
      - put: repo
        params: {repository: repo}
  # Build Odoo docker images
  - name: build-base-14
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-odoo-14
            trigger: true
          - get: ubuntu
            params: {format: oci}
      - task: update-repo
        params:
          GITHUB_TOKEN: ((GITHUB_TOKEN))
          ODOO_EDITION: "base"
          ODOO_VERSION: "14.0"
        file: repo/.ci/tasks/update-repos.yaml
      - task: build
        input_mapping: {base-image: ubuntu}
        privileged: true
        file: repo/.ci/tasks/build-odoo.yaml
        params:
          ODOO_EDITION: "base"
          ODOO_VERSION: "14"
          BUILD_ARG_SSH_KEY: ((GITHUB_SSH_KEY))
          IMAGE_ARG_base_image: base-image/image.tar
        output_mapping: {image: "base-14"}
      - put: base-14
        params:
          image: base-14/image.tar
          additional_tags: base-14/today-tag
  - name: build-community-14
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: daily
            trigger: true
          - get: nightly
            trigger: true
          - get: base-14
            params: {format: oci}
            trigger: true
            passed: [build-base-14]
      - task: update-repo
        params:
          GITHUB_TOKEN: ((GITHUB_TOKEN))
          ODOO_EDITION: "community"
          ODOO_VERSION: "14.0"
        file: repo/.ci/tasks/update-repos.yaml
      - task: build
        input_mapping: {base-image: base-14}
        privileged: true
        file: repo/.ci/tasks/build-odoo.yaml
        params:
          ODOO_EDITION: "community"
          ODOO_VERSION: "14"
          BUILD_ARG_SSH_KEY: ((GITHUB_SSH_KEY))
          IMAGE_ARG_base_image: base-image/image.tar
        output_mapping: {image: "community-14"}
      - put: community-14
        params:
          image: community-14/image.tar
          additional_tags: community-14/today-tag
  - name: build-enterprise-14
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: community-14
            params: {format: oci}
            trigger: true
            passed: [build-community-14]
      - task: update-repo
        params:
          GITHUB_TOKEN: ((GITHUB_TOKEN))
          ODOO_EDITION: "enterprise"
          ODOO_VERSION: "14.0"
        file: repo/.ci/tasks/update-repos.yaml
      - task: build
        input_mapping: {base-image: community-14}
        privileged: true
        file: repo/.ci/tasks/build-odoo.yaml
        params:
          ODOO_EDITION: "enterprise"
          ODOO_VERSION: "14"
          BUILD_ARG_SSH_KEY: ((GITHUB_SSH_KEY))
          IMAGE_ARG_base_image: base-image/image.tar
        output_mapping: {image: "enterprise-14"}
      - put: enterprise-14
        params:
          image: enterprise-14/image.tar
          additional_tags: enterprise-14/today-tag
  - name: build-base-15
    <<: *notify
    plan:
      - in_parallel:
          - get: repo
          - get: repo-odoo-15
            trigger: true
          - get: ubuntu
            params: {format: oci}
      - task: update-repo
        params:
