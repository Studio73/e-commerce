            params: {format: oci}
            passed: [build-base-14]
      - task: aggregate-prs
        params:
          GITHUB_TOKEN: ((GITHUB_TOKEN))
          ODOO_EDITION: "community"
          ODOO_VERSION: "14.0"
          ADD_OPEN_PRS: true
        file: repo/.ci/tasks/update-repos.yaml
      - task: build
